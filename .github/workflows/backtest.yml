name: backtest
on:
  workflow_dispatch:
    inputs:
      years:
        description: "years of history"
        default: "6"
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: history + config sync
        run: python scripts/fetch_history_ccxt.py --years "${{ github.event.inputs.years || '6' }}" --update-config
      - name: backtest + walk-forward + bootstrap
        run: python scripts/run_backtest.py --walk-forward --bootstrap | tee reports/summary.txt
      - name: send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from goldbot import notify
          from goldbot.config import Config
          cfg = Config.load("config.yaml")
          r = json.load(open("reports/report.json"))
          m = (r.get("walk_forward") or {}).get("metrics") or r["in_sample"]
          kind = "Walk-Forward OOS" if r.get("walk_forward") else "In-sample"
          bs = r.get("bootstrap_1y") or {}
          txt = (f"Backtest {cfg.symbol} ({r['in_sample']['years']} J. Daten)\n{kind}: CAGR {m['cagr']:+.1%}  Sharpe {m['sharpe']}  "
                 f"MaxDD {m['max_drawdown']:.1%}  PSR {m.get('psr_gt_0')}  Trades {m['trades']}\n"
                 f"Kosten {m['total_cost']} + Funding {m['total_swap']}  P&L/Tag {m.get('pnl_per_trading_day')}")
          if bs:
              txt += f"\nBootstrap 1J: p05/p50/p95 {bs['return_p05']:+.1%}/{bs['return_p50']:+.1%}/{bs['return_p95']:+.1%}, P(Verlust) {bs['prob_loss']:.0%}"
          notify.send_photo(cfg, "reports/backtest.png", txt)
          notify.send(cfg, txt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/
      - name: commit synced config + report
        if: always()
        run: |
          git config user.name goldbot
          git config user.email goldbot@users.noreply.github.com
          git add config.yaml
          git add -f reports/report.json reports/summary.txt reports/backtest.png 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "backtest report + config synced from exchange" && git push)
