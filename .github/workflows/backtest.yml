name: backtest
on:
  workflow_dispatch:
    inputs:
      years:
        description: "years of history"
        default: "6"
      spread:
        description: "override spread (USDT/unit), empty = from venue"
        default: ""
      fee:
        description: "override taker fee fraction, empty = from venue"
        default: ""
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: history + config sync
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python scripts/fetch_history_ccxt.py --years "${{ github.event.inputs.years || '6' }}" --update-config 2>&1 | tee reports/fetch.log
      - name: backtest + walk-forward + bootstrap
        shell: bash
        run: |
          set -o pipefail
          EXTRA=""
          [ -n "${{ github.event.inputs.spread }}" ] && EXTRA="$EXTRA --spread ${{ github.event.inputs.spread }}"
          [ -n "${{ github.event.inputs.fee }}" ] && EXTRA="$EXTRA --fee ${{ github.event.inputs.fee }}"
          python scripts/run_backtest.py --walk-forward --bootstrap --purged-cv --directions $EXTRA 2>&1 | tee reports/summary.txt
      - name: send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from goldbot import notify
          from goldbot.config import Config
          cfg = Config.load("config.yaml")
          r = json.load(open("reports/report.json"))
          pm = r["portfolio"]["metrics"]; kind = "Walk-Forward OOS" if r["portfolio"]["kind"] == "walk_forward" else "In-sample"
          bs = r.get("bootstrap_1y") or {}
          txt = f"Backtest Portfolio ({kind}, {pm.get('years')} J.)\nCAGR {pm['cagr']:+.1%}  Sharpe {pm['sharpe']}  MaxDD {pm['max_drawdown']:.1%}  PSR {pm.get('psr_gt_0')}\n"
          for sym, e in r["symbols"].items():
              m = (e.get("walk_forward") or {}).get("metrics") or e["in_sample"]
              txt += (f"{sym.split('/')[0]} ({r['weights'][sym]:.0%}): CAGR {m['cagr']:+.1%} Sharpe {m['sharpe']} MaxDD {m['max_drawdown']:.1%} "
                      f"Trades {m['trades']} Kosten {m['total_cost']}\n")
              cv = (e.get("purged_cv") or {}).get("summary")
              if cv:
                  txt += f"   Purged-CV: {cv['positive_folds']}/{cv['folds']} Folds positiv, median OOS-Sharpe {cv['median_oos_sharpe']}\n"
              dd = e.get("directions") or {}
              if dd:
                  txt += "   " + "  ".join(f"{k}: SR {v['sharpe']} ({v['trades']} T)" for k, v in dd.items()) + "\n"
          if bs:
              txt += f"\nBootstrap 1J: p05/p50/p95 {bs['return_p05']:+.1%}/{bs['return_p50']:+.1%}/{bs['return_p95']:+.1%}, P(Verlust) {bs['prob_loss']:.0%}"
          notify.send_photo(cfg, "reports/backtest.png", txt)
          notify.send(cfg, txt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/
      - name: commit synced config + report
        if: always()
        run: |
          git config user.name goldbot
          git config user.email goldbot@users.noreply.github.com
          git add config.yaml
          for f in reports/report.json reports/summary.txt reports/backtest.png reports/fetch.log data/*_meta.json; do [ -f "$f" ] && git add -f "$f"; done; true
          git diff --cached --quiet || (git commit -m "backtest report + config synced from exchange" && git push)
