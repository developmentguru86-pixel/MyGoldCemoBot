name: backtest
on:
  workflow_dispatch:
    inputs:
      years:
        description: "years of history"
        default: "6"
      spread:
        description: "override spread (USDT/unit), empty = from venue"
        default: ""
      fee:
        description: "override taker fee fraction, empty = from venue"
        default: ""
      timeframe:
        description: "H4 | H1 | M15 | D1"
        default: "H4"
      grid:
        description: "full | small"
        default: "full"
      cv:
        description: "purged CV + direction diagnostics (slow): yes | no"
        default: "yes"
      meta:
        description: "meta-labeling CV: yes | no"
        default: "yes"
      transfer:
        description: "meta-model trained on H4 entries, applied to the run timeframe: yes | no"
        default: "no"
      history:
        description: "venue (6y crypto-venue data) | long (decades of daily data from stooq/yahoo; D1 only)"
        default: "venue"
      extra:
        description: "extra run_backtest flags, e.g. --unscaled --no-funding --weights XAU=0,BTC=0.6,ETH=0.4"
        default: ""
concurrency:
  group: backtest
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt yfinance
      - name: history + config sync
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python scripts/fetch_history_ccxt.py --years "${{ github.event.inputs.years || '6' }}" --timeframe "${{ github.event.inputs.timeframe || 'H4' }}" 2>&1 | tee reports/fetch.log
          if [ "${{ github.event.inputs.history || 'venue' }}" = "long" ]; then
            python scripts/fetch_long_history.py 2>&1 | tee -a reports/fetch.log
          fi
          if [ "${{ github.event.inputs.transfer || 'no' }}" = "yes" ] && [ "${{ github.event.inputs.timeframe || 'H4' }}" != "H4" ]; then
            python scripts/fetch_history_ccxt.py --years "${{ github.event.inputs.years || '6' }}" --timeframe H4 2>&1 | tee -a reports/fetch.log
          fi
      - name: backtest + walk-forward + bootstrap
        shell: bash
        run: |
          set -o pipefail
          EXTRA="--timeframe ${{ github.event.inputs.timeframe || 'H4' }} --grid ${{ github.event.inputs.grid || 'full' }}"
          [ "${{ github.event.inputs.cv || 'yes' }}" = "yes" ] && EXTRA="$EXTRA --purged-cv --directions"
          [ "${{ github.event.inputs.meta || 'yes' }}" = "yes" ] && EXTRA="$EXTRA --meta --meta-pooled"
          [ "${{ github.event.inputs.transfer || 'no' }}" = "yes" ] && EXTRA="$EXTRA --meta-transfer H4"
          EXTRA="$EXTRA --history ${{ github.event.inputs.history || 'venue' }} ${{ github.event.inputs.extra }}"
          [ -n "${{ github.event.inputs.spread }}" ] && EXTRA="$EXTRA --spread ${{ github.event.inputs.spread }}"
          [ -n "${{ github.event.inputs.fee }}" ] && EXTRA="$EXTRA --fee ${{ github.event.inputs.fee }}"
          python scripts/run_backtest.py --walk-forward --bootstrap $EXTRA 2>&1 | tee reports/summary.txt
      - name: send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from goldbot import notify
          from goldbot.config import Config
          cfg = Config.load("config.yaml")
          r = json.load(open("reports/report.json"))
          pm = r["portfolio"]["metrics"]; kind = {"walk_forward": "Walk-Forward OOS", "walk_forward_dynamic": "Walk-Forward OOS, dynamische Sleeves"}.get(r["portfolio"]["kind"], "In-sample")
          bs = r.get("bootstrap_1y") or {}
          txt = f"Backtest Portfolio ({kind}, {pm.get('years')} J.)\nCAGR {pm['cagr']:+.1%}  Sharpe {pm['sharpe']}  MaxDD {pm['max_drawdown']:.1%}  PSR {pm.get('psr_gt_0')}\n"
          g = r.get("gates") or {}
          if g:
              txt += f"Gates: {sum(1 for x in g.values() if x['pass'])}/{len(g)} bestanden\n"
          mp = r.get("meta_pooled")
          if mp:
              txt += f"Gepooltes Meta-Modell: median CV-Sharpe {mp['pooled_primary_median_sharpe']} -> {mp['pooled_meta_median_sharpe']} (besser in {mp['pooled_meta_better']} Folds)\n"
          mtr = r.get("meta_transfer")
          if mtr:
              txt += f"Transfer-Meta (H4->{r.get('timeframe','D1')}): median CV-Sharpe {mtr['pooled_primary_median_sharpe']} -> {mtr['pooled_meta_median_sharpe']} (besser in {mtr['pooled_meta_better']})\n"
              for sym, ps in mtr["per_symbol"].items():
                  txt += f"   {sym.split('/')[0]}: {ps['primary_median_sharpe']} -> {ps['meta_median_sharpe']}, Folds+ {ps['primary_positive_folds']} -> {ps['meta_positive_folds']}, akzeptiert {ps['accepted_share']:.0%}\n"
          pdn = (r.get("portfolio_dynamic") or {}).get("metrics")
          if pdn:
              txt += f"(dynamische Allokation zum Vergleich: Sharpe {pdn['sharpe']})\n"
          ws = r.get("weighting_study") or {}
          for nm, v in ws.items():
              txt += f"Mix {nm}: Sharpe {v['sharpe']}, CAGR {v['cagr']:+.1%}, MaxDD {v['max_drawdown']:.1%}, P(Verlust) {v['prob_loss']:.0%}\n"
          cs = r.get("cost_stress") or {}
          for mult, row in cs.items():
              txt += f"Kosten {mult}x: " + ", ".join(f"{k.split('/')[0]} SR {v['sharpe']}" for k, v in row.items()) + "\n"
          vp = r.get("vol_target_projection") or {}
          for tv, v in vp.items():
              txt += f"Vol-Ziel {float(tv):.0%}: CAGR {v['cagr']:+.1%}, MaxDD {v['max_drawdown']:.1%}, P(Verlust) {v['prob_loss']:.0%}, ≈ {v['eur_per_day_on_5k']} USDT/Tag auf 5k\n"
          for sym, e in r["symbols"].items():
              m = (e.get("walk_forward") or {}).get("metrics") or e["in_sample"]
              txt += (f"{sym.split('/')[0]} ({r['weights'][sym]:.0%}): CAGR {m['cagr']:+.1%} Sharpe {m['sharpe']} MaxDD {m['max_drawdown']:.1%} "
                      f"Trades {m['trades']} Kosten {m['total_cost']}\n")
              cv = (e.get("purged_cv") or {}).get("summary")
              if cv:
                  txt += f"   Purged-CV: {cv['positive_folds']}/{cv['folds']} Folds positiv, median OOS-Sharpe {cv['median_oos_sharpe']}\n"
              dd = e.get("directions") or {}
              if dd:
                  txt += "   " + "  ".join(f"{k}: SR {v['sharpe']} ({v['trades']} T)" for k, v in dd.items()) + "\n"
              mt = (e.get("meta") or {}).get("long", {}).get("summary")
              if mt:
                  txt += (f"   Meta-Labeling (long): median CV-Sharpe {mt['primary_median_sharpe']} -> {mt['meta_median_sharpe']}, "
                          f"pos. Folds {mt['primary_positive_folds']} -> {mt['meta_positive_folds']}, akzeptiert {mt['accepted_share']:.0%}\n")
          if bs:
              txt += f"\nBootstrap 1J: p05/p50/p95 {bs['return_p05']:+.1%}/{bs['return_p50']:+.1%}/{bs['return_p95']:+.1%}, P(Verlust) {bs['prob_loss']:.0%}"
          notify.send_photo(cfg, "reports/backtest.png", txt)
          notify.send(cfg, txt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/
      - name: commit synced config + report
        if: always()
        run: |
          git config user.name goldbot
          git config user.email goldbot@users.noreply.github.com
          git add config.yaml
          for f in reports/report.json reports/summary.txt reports/backtest.png reports/fetch.log data/*_meta.json; do [ -f "$f" ] && git add -f "$f"; done; true
          git diff --cached --quiet || (git commit -m "backtest report + config synced from exchange" && (git pull --rebase -X theirs origin main || true) && git push)
