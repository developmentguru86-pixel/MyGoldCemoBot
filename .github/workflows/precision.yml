name: precision_entry
on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "H4 | H1 | D1"
        default: "H4"
      risk:
        description: "risk per trade"
        default: "0.025"
      target_r:
        description: "take profit in R"
        default: "2.0"
      layer1:
        description: "use the quant direction gate: yes | no"
        default: "yes"
concurrency:
  group: backtest
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: entry-timeframe history
        shell: bash
        run: |
          mkdir -p reports data
          python scripts/fetch_history_ccxt.py --years 6 --timeframe "${{ github.event.inputs.timeframe || 'H4' }}" 2>&1 | tee reports/precision_fetch.log
      - name: run engine
        shell: bash
        run: |
          set -o pipefail
          EXTRA=""
          [ "${{ github.event.inputs.layer1 || 'yes' }}" = "no" ] && EXTRA="--no-layer1"
          python scripts/run_precision.py --timeframe "${{ github.event.inputs.timeframe || 'H4' }}" \
            --risk "${{ github.event.inputs.risk || '0.025' }}" --target-r "${{ github.event.inputs.target_r || '2.0' }}" \
            $EXTRA 2>&1 | tee reports/precision.log
      - name: notify + commit
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY' || true
          import json, sys
          sys.path.insert(0, ".")
          from goldbot import notify
          from goldbot.config import Config
          cfg = Config.load("config.yaml")
          r = json.load(open("reports/precision.json"))
          m, ru = r["portfolio"], r["ruin"]
          pos = sum(1 for f in r["folds"] if f["expectancy_R"] > 0)
          txt = (f"Entry-Engine {r['timeframe']} (Layer1={'an' if r['layer1'] else 'aus'}, Risk {r['risk_per_trade']:.1%}, Ziel {r['target_r']}R)\n"
                 f"Trades {m['trades']} ({m['trades_per_year']}/Jahr)\n"
                 f"Winrate {m['winrate']:.1%} | Avg Win {m['avg_win_R']}R | Avg Loss {m['avg_loss_R']}R\n"
                 f"Expectancy {m['expectancy_R']}R | Profit Factor {m['profit_factor']}\n"
                 f"Sharpe {m['sharpe']} | MaxDD {m['max_drawdown']:.1%} | laengste Verlustserie {m['max_losing_streak']}\n"
                 f"P(Verlust 1J) {ru['p_loss']:.0%} | P(DD>20%) {ru['p_dd_gt_20pct']:.0%} | P(DD>40%) {ru['p_dd_gt_40pct']:.0%}\n"
                 f"EUR/Handelstag auf 5.000: {m['eur_per_trading_day']}\n"
                 f"Folds mit positivem Erwartungswert: {pos}/{len(r['folds'])}")
          notify.send(cfg, txt)
          PY
          git config user.name goldbot
          git config user.email goldbot@users.noreply.github.com
          for f in reports/precision.log reports/precision.json reports/precision_fetch.log; do [ -f "$f" ] && git add -f "$f"; done; true
          git diff --cached --quiet || (git commit -m "precision entry engine results" && (git pull --rebase -X theirs origin main || true) && git push)
