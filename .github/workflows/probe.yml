name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - shell: bash
        run: |
          mkdir -p reports
          python scripts/probe_exchanges.py 2>&1 | tee reports/probe.log
      - if: always()
        run: |
          git config user.name goldbot
          git config user.email goldbot@users.noreply.github.com
          git add -f reports/probe.log
          git diff --cached --quiet || (git commit -m "exchange probe" && git push)
