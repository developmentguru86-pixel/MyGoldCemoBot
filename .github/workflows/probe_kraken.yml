name: probe_kraken
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          mkdir -p reports
          {
          for u in "https://www.okx.com/api/v5/account/balance" \
                   "https://www.okx.com/api/v5/public/instruments?instType=SWAP&instId=XAU-USDT-SWAP" \
                   "https://testnet-api.phemex.com/accounts/accountPositions?currency=USDT" \
                   "https://testnet-api.phemex.com/public/products" \
                   "https://api.bitget.com/api/v2/mix/account/accounts?productType=SUSDT-FUTURES" \
                   "https://open-api.bingx.com/openApi/swap/v2/user/balance" \
                   "https://open-api-vst.bingx.com/openApi/swap/v2/user/balance" \
                   "https://futures.kraken.com/derivatives/api/v3/accounts" \
                   "https://api.hyperliquid-testnet.xyz/info"; do
            echo "== $u"
            curl -s -o /tmp/body -w "http %{http_code} type %{content_type} redirect->%{redirect_url}\n" -H "x-simulated-trading: 1" -H "Accept: application/json" "$u"
            head -c 220 /tmp/body | tr '\n' ' '; echo
          done
          } 2>&1 | tee reports/probe_kraken.log
      - if: always()
        run: |
          git config user.name goldbot
          git config user.email goldbot@users.noreply.github.com
          git add -f reports/probe_kraken.log
          git diff --cached --quiet || (git commit -m "kraken demo probe" && git push)
