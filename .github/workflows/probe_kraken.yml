name: probe_kraken
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          mkdir -p reports
          {
          echo "== phemex testnet gold products"
          curl -s "https://testnet-api.phemex.com/public/products" | python3 -c "
          import sys, json; d = json.load(sys.stdin)['data']
          for p in d.get('perpProductsV2', []) + d.get('products', []):
              s = p.get('symbol', '')
              if any(g in s.upper() for g in ('PAXG', 'XAU', 'GOLD')):
                  print(s, p.get('type'), 'contractSize', p.get('contractSize'), 'qtyStepSize', p.get('qtyStepSize'), 'status', p.get('status'))
          "
          echo "== bingx vst gold contracts"
          curl -s "https://open-api-vst.bingx.com/openApi/swap/v2/quote/contracts" | python3 -c "
          import sys, json; d = json.load(sys.stdin).get('data', [])
          print([c['symbol'] for c in d if any(g in c['symbol'].upper() for g in ('PAXG', 'XAU', 'GOLD'))][:10])
          "
          } 2>&1 | tee reports/probe_kraken.log
      - if: always()
        run: |
          git config user.name goldbot
          git config user.email goldbot@users.noreply.github.com
          git add -f reports/probe_kraken.log
          git diff --cached --quiet || (git commit -m "kraken demo probe" && git push)
