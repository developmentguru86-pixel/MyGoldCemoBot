# goldbot — serverlos: GitHub Actions (Cron alle 4h) + Phemex Testnet (kein KYC). Portfolio: Gold (XAU/USDT-Perp) + BTC (BTC/USDT-Perp).
# Werte unter contract/costs werden vom Backtest-Workflow automatisch vom Exchange gesetzt.
venue: exchange
symbol: XAU/USDT:USDT        # Primärsymbol (Fallback, wenn `symbols` leer)
symbols:                     # Portfolio: Gewicht = Anteil des 5.000er-Kontos je Symbol; Kill-Switches wirken auf das Gesamtkonto
  "XAU/USDT:USDT":           # Gewichte vorlaeufig gleichverteilt-ish; die Gewichtungsstudie ueber 5 Sleeves entscheidet
    weight: 0.1
    history_sources: ["bitfinex:XAUT/USDT", "bitfinex:XAUT/USD"]
  "BTC/USDT:USDT":
    weight: 0.25
    history_sources: ["bitfinex:BTC/USDT", "bitfinex:BTC/USD"]
  "ETH/USDT:USDT":           # aktiv: CV-Median 0,88 bei 4/6 Folds über 8,8 J. (bestand die Sleeve-Gates)
    weight: 0.25
    history_sources: ["bitfinex:ETH/USDT", "bitfinex:ETH/USD"]
  "SOL/USDT:USDT":           # Screening 13.09.: CV-Median 1,02 (5/6), Korrelation 0,32 zu BTC
    weight: 0.2
    history_sources: ["bitfinex:SOL/USDT", "bitfinex:SOL/USD"]
  "XRP/USDT:USDT":           # Screening 13.09.: CV-Median 0,68 (5/6), Korrelation 0,21 zu ETH
    weight: 0.2
    history_sources: ["bitfinex:XRP/USDT", "bitfinex:XRP/USD"]
    history_sources: ["bitfinex:ETH/USDT", "bitfinex:ETH/USD"]
timeframe: D1                # Tageskerzen: die Variante, die im Walk-Forward trägt (Gold 0,99 / Long-only 1,18)
bars_per_day: 1
trading_days_per_year: 365   # Krypto handelt 24/7
starting_equity: 5000        # Backtest-Start
equity_cap: 5000             # Demo-Konto hat ~100k; Bot handelt, als wären es 5.000 + realisierter P&L

contract:                    # wird von fetch_history_ccxt --update-config gesetzt
  size: 1.0
  min_lot: 0.001
  lot_step: 0.001
  max_lot: 1000000000.0

strategy:                    # Live = die auf D1 am häufigsten gewählte Variante (7/8 Fenster bei Gold-long)
  lookbacks: [20, 60, 120]   # Tage ≈ 1 / 3 / 6 Monate
  vol_span: 20
  target_vol: 0.10
  max_leverage: 24.0
  rebalance_threshold: 0.15
  vol_floor: 0.05
  entry_min_signal: 1.0      # Einstieg nur, wenn alle Lookbacks einig sind; Ausstieg erst bei Umkehr
  exit_min_signal: 0.0
  z_min: 0.0
  min_hold_bars: 3           # kein Flip innerhalb von 3 Tagen
  direction: long            # Shorts: in jedem Fenster, jedem Asset negativ; der Allokator hat sie nie finanziert
  exposure_scale: 24.0       # ~48 % Vol-Ziel = halber Kelly bei 5 Sleeves (k*=48x, Vol 2,0 %). Median ~5,7 $/Tag, MaxDD ~-33 %. DEMO.
  confidence: false          # Confidence-Sizing: vom Selektor in 6/8 Fenstern verworfen
  regime:
    er_window: 0             # ER-Filter auf D1 vom Selektor nie gewählt
    er_min: 0.25
    vol_pct_window: 120
    vol_pct_max: 0.9
    high_vol_scale: 0.5
  kelly:
    enabled: true
    fraction: 0.5
    window: 120
    min_mult: 0.25
    cost_aware: true
    cost_margin: 1.5

costs:
  spread: 1.17                # USDT je Einheit, Fallback; wird vom Ticker gesetzt
  slippage: 0.3
  slippage_pct: 0.0001       # 1 bp je Seite, symbolunabhängig (überschreibt `slippage` im Backtest je Symbol)
  swap_long_annual: -0.0    # Funding annualisiert, wird vom Exchange gesetzt (long zahlt bei positivem Funding)
  swap_short_annual: 0.0
  commission_per_lot: 0.0
  fee_pct: 0.001            # Phemex Taker 0.06 %, wird vom Exchange gesetzt

risk:
  daily_loss_limit: 0.10     # bei 50 % Zielvol ist die Tagesvol 2,6 %: 10 % = 4-Sigma-Tag, sonst feuert der Stopp im Normalbetrieb
  max_drawdown_halt: 0.55    # Median-MaxDD bei 16x ist ~-34 %: darunter kein Schutz mehr moeglich, nur noch Reissleine
  max_spread: 4.0            # absolut; nur relevant, wenn max_spread_pct = 0
  max_spread_pct: 0.0008     # 0,08 % vom Kurs: kein neuer Einstieg bei breiterem Spread (Gold ~3.5, BTC ~80 USDT)
  max_bridge_failures: 3
  poll_seconds: 30

exchange:
  id: phemex
  demo: true                 # testnet-api.phemex.com; false = Echtgeld, braucht --allow-real-account
  leverage: 10               # nur Margin-Plumbing: Risiko steuert exposure_scale, nicht dieser Wert.
                             # Bei 24x Skalierung braucht das Portfolio bis 5,5x Notional -> 3x Boersenhebel waere zu eng (Margin-Call).
  api_key: ""                # leer lassen – GitHub Secret EXCHANGE_API_KEY
  api_secret: ""             # EXCHANGE_API_SECRET
  api_passphrase: ""         # nur OKX/KuCoin/Bitget; Phemex hat keine
  history_symbol: ""
  history_sources:           # weitere öffentliche Quellen, die längste Historie gewinnt
    - "bitfinex:XAUT/USDT"
    - "bitfinex:XAUT/USD"
    - "coinbase:PAXG/USD"
    - "mexc:PAXG/USDT"
    - "kucoin:PAXG/USDT"

telegram:
  token: ""                  # GitHub Secret TELEGRAM_TOKEN
  chat_id: 0                 # GitHub Secret TELEGRAM_CHAT_ID
  mode: live                 # live = echte Orders auf dem Demo-Konto
  autostart: true
  daily_summary_hour: 21

bridge:                      # nur für venue: mt5
  url: http://127.0.0.1:5000
  timeout: 10
  deviation_points: 30
  magic: 20260912

paths:
  data: data/XAU_H4.csv
  reports: reports
  state_live: state/live_state.json
  state_paper: state/paper_state.json
  paper_account: state/paper_account.json
  journal_live: logs/journal_live.csv
  journal_paper: logs/journal_paper.csv
