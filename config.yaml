# goldbot — serverlos: GitHub Actions (Cron alle 4h) + Phemex Testnet (kein KYC). Portfolio: Gold (XAU/USDT-Perp) + BTC (BTC/USDT-Perp).
# Werte unter contract/costs werden vom Backtest-Workflow automatisch vom Exchange gesetzt.
venue: exchange
symbol: XAU/USDT:USDT        # Primärsymbol (Fallback, wenn `symbols` leer)
symbols:                     # Portfolio: Gewicht = Anteil des 5.000er-Kontos je Symbol; Kill-Switches wirken auf das Gesamtkonto
  "XAU/USDT:USDT":
    weight: 0.5
    history_sources: ["bitfinex:XAUT/USDT", "bitfinex:XAUT/USD"]
  "BTC/USDT:USDT":
    weight: 0.5
    history_sources: ["bitfinex:BTC/USDT", "bitfinex:BTC/USD"]
timeframe: H4
bars_per_day: 6
trading_days_per_year: 365   # Krypto handelt 24/7
starting_equity: 5000        # Backtest-Start
equity_cap: 5000             # Demo-Konto hat ~100k; Bot handelt, als wären es 5.000 + realisierter P&L

contract:                    # wird von fetch_history_ccxt --update-config gesetzt
  size: 1.0
  min_lot: 0.001
  lot_step: 0.001
  max_lot: 1000000000.0

strategy:                    # Live-Parameter = die vom Walk-Forward/Purged-CV am häufigsten gewählte Variante
  lookbacks: [60, 180, 360]  # H4-Bars ≈ 10 / 30 / 60 Tage
  vol_span: 60
  target_vol: 0.10
  max_leverage: 3.0
  rebalance_threshold: 0.15
  vol_floor: 0.05
  entry_min_signal: 1.0      # Einstieg nur, wenn alle Lookbacks einig sind; Ausstieg erst bei Umkehr (Hysterese)
  exit_min_signal: 0.0
  z_min: 0.0
  min_hold_bars: 6           # kein Flip innerhalb von 24 h
  direction: both
  regime:
    er_window: 60            # Efficiency Ratio über 10 Tage: Range-Regime -> flat
    er_min: 0.25
    vol_pct_window: 500      # Vol-Perzentil über ~3 Monate
    vol_pct_max: 0.9         # über dem 90. Perzentil: halbe Größe
    high_vol_scale: 0.5
  kelly:
    enabled: true
    fraction: 0.5
    window: 300
    min_mult: 0.25
    cost_aware: true         # Kelly-mu abzüglich geschätztem Kosten-Drag (Turnover x Kosten) x Sicherheitsfaktor
    cost_margin: 1.5

costs:
  spread: 1.17                # USDT je Einheit, Fallback; wird vom Ticker gesetzt
  slippage: 0.3
  slippage_pct: 0.0001       # 1 bp je Seite, symbolunabhängig (überschreibt `slippage` im Backtest je Symbol)
  swap_long_annual: -0.0    # Funding annualisiert, wird vom Exchange gesetzt (long zahlt bei positivem Funding)
  swap_short_annual: 0.0
  commission_per_lot: 0.0
  fee_pct: 0.001            # Phemex Taker 0.06 %, wird vom Exchange gesetzt

risk:
  daily_loss_limit: 0.03
  max_drawdown_halt: 0.20
  max_spread: 4.0            # absolut; nur relevant, wenn max_spread_pct = 0
  max_spread_pct: 0.0008     # 0,08 % vom Kurs: kein neuer Einstieg bei breiterem Spread (Gold ~3.5, BTC ~80 USDT)
  max_bridge_failures: 3
  poll_seconds: 30

exchange:
  id: phemex
  demo: true                 # testnet-api.phemex.com; false = Echtgeld, braucht --allow-real-account
  leverage: 3
  api_key: ""                # leer lassen – GitHub Secret EXCHANGE_API_KEY
  api_secret: ""             # EXCHANGE_API_SECRET
  api_passphrase: ""         # nur OKX/KuCoin/Bitget; Phemex hat keine
  history_symbol: ""
  history_sources:           # weitere öffentliche Quellen, die längste Historie gewinnt
    - "bitfinex:XAUT/USDT"
    - "bitfinex:XAUT/USD"
    - "coinbase:PAXG/USD"
    - "mexc:PAXG/USDT"
    - "kucoin:PAXG/USDT"

telegram:
  token: ""                  # GitHub Secret TELEGRAM_TOKEN
  chat_id: 0                 # GitHub Secret TELEGRAM_CHAT_ID
  mode: live                 # live = echte Orders auf dem Demo-Konto
  autostart: true
  daily_summary_hour: 21

bridge:                      # nur für venue: mt5
  url: http://127.0.0.1:5000
  timeout: 10
  deviation_points: 30
  magic: 20260912

paths:
  data: data/XAU_H4.csv
  reports: reports
  state_live: state/live_state.json
  state_paper: state/paper_state.json
  paper_account: state/paper_account.json
  journal_live: logs/journal_live.csv
  journal_paper: logs/journal_paper.csv
