# goldbot — serverlos: GitHub Actions (Cron alle 4h) + OKX Demo-Trading. Gold als XAU/USDT-Perpetual.
# Werte unter contract/costs werden vom Backtest-Workflow automatisch vom Exchange gesetzt.
venue: exchange
symbol: XAU/USDT:USDT        # OKX Gold-Index-Perp (ccxt-Notation)
timeframe: H4
bars_per_day: 6
trading_days_per_year: 365   # Krypto handelt 24/7
starting_equity: 5000        # Backtest-Start (USDT); live zählt das Demo-Konto

contract:                    # wird von fetch_history_ccxt --update-config gesetzt
  size: 1
  min_lot: 0.001
  lot_step: 0.001
  max_lot: 1000

strategy:
  lookbacks: [30, 90, 180]   # H4-Bars ≈ 5 / 15 / 30 Tage
  vol_span: 60
  target_vol: 0.12
  max_leverage: 3.0
  rebalance_threshold: 0.15
  vol_floor: 0.05
  kelly:
    enabled: true
    fraction: 0.5
    window: 300
    min_mult: 0.25

costs:
  spread: 1.0                # USDT je Einheit, Fallback; wird vom Ticker gesetzt
  slippage: 0.3
  swap_long_annual: -0.05    # Funding annualisiert, wird vom Exchange gesetzt (long zahlt bei positivem Funding)
  swap_short_annual: 0.05
  commission_per_lot: 0.0
  fee_pct: 0.0005            # OKX Taker 0.05 %, wird vom Exchange gesetzt

risk:
  daily_loss_limit: 0.03
  max_drawdown_halt: 0.20
  max_spread: 4.0            # USDT je Einheit; Illiquidität → kein neuer Einstieg
  max_bridge_failures: 3
  poll_seconds: 30

exchange:
  id: okx
  demo: true                 # OKX Demo-Trading (x-simulated-trading); false = Echtgeld, braucht --allow-real-account
  leverage: 3
  api_key: ""                # leer lassen – GitHub Secret EXCHANGE_API_KEY
  api_secret: ""             # EXCHANGE_API_SECRET
  api_passphrase: ""         # EXCHANGE_API_PASSPHRASE (OKX verlangt eine)
  history_symbol: PAXG/USDT  # längere Historie für den Backtest (gleicher Basiswert, Spot)

telegram:
  token: ""                  # GitHub Secret TELEGRAM_TOKEN
  chat_id: 0                 # GitHub Secret TELEGRAM_CHAT_ID
  mode: live                 # live = echte Orders auf dem Demo-Konto
  autostart: true
  daily_summary_hour: 21

bridge:                      # nur für venue: mt5
  url: http://127.0.0.1:5000
  timeout: 10
  deviation_points: 30
  magic: 20260912

paths:
  data: data/XAU_H4.csv
  reports: reports
  state_live: state/live_state.json
  state_paper: state/paper_state.json
  paper_account: state/paper_account.json
  journal_live: logs/journal_live.csv
  journal_paper: logs/journal_paper.csv
